name: Publish

# Publishes to npm on a version tag, using npm Trusted Publishing (OIDC).
# There is no NPM_TOKEN: the npm CLI detects the OIDC environment and
# authenticates with a short-lived credential, so no long-lived secret exists
# to leak or rotate. Configure the trusted publisher on npmjs.com against this
# repository and this filename (publish.yml).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      # The npm bundled with Node 22.14 predates OIDC support.
      - run: npm install -g npm@latest

      - run: npm ci

      # Fail loudly if the tag and package.json disagree, rather than
      # publishing a version nobody asked for.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json $pkg"
            exit 1
          fi

      - run: npm run check
      - run: npm run test:unit
      # Provenance is attested automatically under trusted publishing.
      - run: npm publish --access public
