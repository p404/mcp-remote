name: Publish

# Publishes to npm on a version tag, using npm Trusted Publishing (OIDC).
# There is no NPM_TOKEN: the npm CLI detects the OIDC environment and
# authenticates with a short-lived credential, so no long-lived secret exists
# to leak or rotate. Configure the trusted publisher on npmjs.com against this
# repository and this filename (publish.yml).
on:
  push:
    tags:
      - 'v*'

# One publish at a time; two tags pushed together must not race.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Trusted publishing needs npm >= 11.5.1, and current npm requires
          # Node >= 22.22.2 / >= 24.15.0, so track the 24 LTS line.
          node-version: '24'
          # Required: npm resolves the OIDC audience from the configured
          # registry, so setup-node must write it into .npmrc.
          registry-url: 'https://registry.npmjs.org'

      # Ensure an npm new enough to authenticate over OIDC.
      - run: npm install -g npm@latest
      # Surface what actually ran: OIDC needs npm >= 11.5.1, and a silent
      # fallback to an older npm looks exactly like a missing trusted publisher.
      - run: node -v && npm -v && npm config get registry

      # No package-lock.json is committed (upstream uses pnpm), so `npm ci`
      # has nothing to install from.
      - run: npm install --no-audit --no-fund

      # Fail loudly if the tag and package.json disagree, rather than
      # publishing a version nobody asked for.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json $pkg"
            exit 1
          fi

      - run: npm run check
      - run: npm run test:unit
      # Provenance is attested automatically under trusted publishing.
      - run: npm publish --access public
