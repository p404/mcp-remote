name: Release

# Publishes to npm when a version tag is pushed. Deliberately not on every
# push: the upstream workflow this replaces published a preview build per
# commit to a third-party service, which is not what a dependency other
# people install should do.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Fail early and loudly if the tag and package.json disagree, rather
      # than publishing a version nobody asked for.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json $pkg"
            exit 1
          fi

      - run: npm run check
      - run: npm run test:unit
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
